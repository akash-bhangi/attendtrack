<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep slate / modern navy -->
    <linearGradient id="bgGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Sky Blue Gradient -->
    <linearGradient id="skyGrad" x1="16" y1="12" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Attendance Success Green Gradient -->
    <linearGradient id="checkGrad" x1="18" y1="20" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle Glow for Checkmark -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10B981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2" />

  <!-- Calendar Card Outline / Silhouette -->
  <rect x="13" y="16" width="38" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2" />

  <!-- Calendar Header Band (Brand Accent) -->
  <path d="M13 22C13 18.6863 15.6863 16 19 16H45C48.3137 16 51 18.6863 51 22V24H13V22Z" fill="url(#skyGrad)" />

  <!-- Calendar Binder Pegs -->
  <rect x="21" y="11" width="4" height="8" rx="2" fill="#F8FAFC" />
  <rect x="39" y="11" width="4" height="8" rx="2" fill="#F8FAFC" />

  <!-- Attendance 75% Target Progress Ring (Subtle behind check) -->
  <circle cx="32" cy="38" r="10" stroke="#334155" stroke-width="2.5" fill="none" opacity="0.4" />
  <path d="M 32 28 A 10 10 0 1 1 23.5 43.2" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Bold Glowing Attendance Present Checkmark -->
  <path d="M24 37.5L29.5 43L41.5 30" stroke="url(#checkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
